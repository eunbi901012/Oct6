services:
  database:
    image: postgres:16.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-faculty_common}
      POSTGRES_USER: ${POSTGRES_USER:-faculty_common}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faculty_common}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    image: faculty-common-backend:1.0.0
    build:
      context: ../backend
      dockerfile: Dockerfile
    pull_policy: build
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-faculty_common}
      DB_USERNAME: ${POSTGRES_USER:-faculty_common}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-faculty_common}
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    restart: unless-stopped

  frontend:
    image: faculty-common-frontend:1.0.0
    build:
      context: ../frontend
      dockerfile: Dockerfile
    pull_policy: build
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  postgres_data:

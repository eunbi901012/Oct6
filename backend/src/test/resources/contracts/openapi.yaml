      - 승인자 동일 여부·자동대입·기간 효과 OQ-005, 역할 교체·회수 표현 OQ-DATA-004, 최후 관리자 역할 변경 거부 OQ-007 미승인
      - REQ-051 전후값·처리자·처리일시·사유 추적 구조; 실제 보존 방식·기간·사유 필수는 OQ-002 승인 의존
      - 요청 DTO의 편집 범위만 허용한다. 다른 리소스·원천·서버 관리 필드를 이 operation으로 변경하려는 입력은 400 필드 오류로 거부하고 보호 데이터를 유지한다. 세부 업무 정책과
        이 기술 DTO 경계 검증을 구분한다.
      x-side-effects:
      - user_role.account_id/role_code/approver_id 참조와 valid_start/valid_end/assignment_source 저장, created_at/updated_at
        서버 관리; 원천 snapshot 불변, 교체 영속 방식 OQ-DATA-004
      x-required-tests:
      - 'happy: 사용자 관리 허용 세션으로 선택 userId에 assignments의 role_code/approver_id/valid_start/valid_end/assignment_source
        제출 -> 200 success=true/meta, GET /api/user-roles?userId=<대상>&page=0&size=1에서 변경 역할·승인자·기간 확인; 구분값은 승인 fixture
        사용'
      - 'auth: PUT /api/users/{userId}/roles에 세션 없음/사용자 관리 미허용 세션 -> 401/403 ApiError, 대상 user_role 매핑 불변'
      - 'validation: assignments=[] 또는 assignments를 객체로 제출 -> 400 ApiError, 대상 user_role 추가·변경·회수 없음; ApiError.fieldErrors에서
        assignments 중 실패 필드와 비어 있지 않은 message 확인'
      - 'business: 역할 변경 요청에 원천 job_grade 필드를 추가 -> 400 ApiError, fieldErrors에 job_grade 표시, korus_personnel_snapshot.job_grade와
        user_role 매핑 불변'
      - 'side-effect: 성공 전후 DB SELECT user_role WHERE account_id=<대상> -> role_code의 role 연결, approver_id의 user_account
        연결과 제출 기간·assignment_source 보존, 생성/수정 행 created_at/updated_at 서버 관리; 원천 snapshot 불변, 교체·회수 저장 방식은 OQ-DATA-004
        승인 의존'

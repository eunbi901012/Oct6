openapi: 3.0.3
info:
  title: 교수업적평가시스템 공통 관리 1차 API
  version: 0.1.0
  description: 공통 관리 1차 API 설계 계약. 허용 입력 spec.md와 requirement-registry.json의 title·statement·acceptance_hint·source_locator를
    기준으로 요구 의미를 보존한다. 기존 경로와 operationId를 유지한다. x-related-requirements의 연결은 요구 면제 또는 구현 완료 증거가 아니다. 미확인 답변·estimated:true는
    승인이 아니며 미정 업무 정책은 OQ로 유지한다.
servers:
- url: /
  description: 동일 origin 상대경로 /api; 브라우저 localhost/service-name 하드코딩 금지
x-semantic-test-policy:
  scope: mutation별 happy/auth/validation/business/side-effect는 조건과 관찰 결과의 계약 시나리오이며 실제 API 실행 성공을 의미하지 않는다.
  fixture: 허용/미허용 메뉴 세션은 승인된 접근 설정으로 준비하며 R09 단독 영구 정책을 가정하지 않는다. 상태·보직구분 값 등 미정값은 승인 fixture 없이 발명하지 않는다.
  pagination: page=0&size=1은 호출 예시이지 기본·상한 정책이 아니다. 조회 테스트는 해당 필터의 total에 따라 page를 순회해 대상 PK를 찾고 입력값과 비교한다. 회수 검증도
    전체 페이지에서 부재를 확인한다.
  unresolved: OQ 미승인 테스트는 unresolved/보류로 기록하고 합격·거부·미실행 성공으로 계수하지 않는다. 승인 뒤 fixture·예상 응답·저장 구조를 확정하여 재실행한다.
  trace: REQ-051은 관리 데이터 변경 operation의 추적 구조 제약이다. 전후값·처리자·처리일시·사유를 구분한다. created_at/updated_at 검증은 전체 변경 추적 영속화
    완료 증거가 아니다. 실제 보존 구조·기간·사유 필수 여부는 OQ-002이며 운영 감사 화면·API를 추가하지 않는다.
  account-read: GET /api/accounts는 정의하지 않는다. 계정 등록·수정 재조회는 실제 PostgreSQL 통합 테스트 DB SELECT user_account로 확인하며 화면
    입력·원천 연결·조회 배치는 OQ-006 승인 필요.
  requirement-binding: 기능 요구는 실제 요청·결과에 연결한다. 데이터·시드·실행·UI 제약은 해당 operation의 저장·실행·소비자 검증 조건에 연결하며 API가 산출물을 생성하거나
    반응형 UI를 렌더링한다고 주장하지 않는다. 제외 요구는 해당 리소스의 확장 금지 경계로 적용하며 제외 기능의 endpoint를 만들지 않는다.
  validation: 필드별 400 오류 안내는 ApiError.fieldErrors의 field/message로 검증한다. 이는 REQ-054/REQ-055의 오류 안내·서버 검증을 위한 기술 응답
    설계이다. 미정 길이·중복·날짜·상태 정책을 승인한 것으로 해석하지 않는다.
  sequential-acceptance: 로그인 성공 후 같은 쿠키로 현재 사용자·메뉴·9개 화면 조회를 순차 검증한다. 기존 입력에는 확정된 비밀번호 재설정 링크 흐름이 없으므로 재설정 endpoint
    또는 token 수동 입력 필드를 추가하지 않는다. 사용중지·만료·회수 상태의 미정 효과는 OQ 승인 전 실행 합격으로 계수하지 않는다.
paths:
  /api/auth/login:
    post:
      operationId: login
      summary: 로그인 화면 / 내부 세션 쿠키 인증
      tags:
      - login
      x-related-requirements:
      - REQ-040
      - REQ-045
      - REQ-055
      - REQ-056
      - REQ-057
      - REQ-058
      - REQ-059
      - REQ-060
      - REQ-061
      - REQ-062
      - REQ-063
      - REQ-068
      - REQ-069
      - REQ-070
      - REQ-071
      - REQ-076
      - REQ-077
      - REQ-078
      - REQ-088
      - REQ-119
      - REQ-120
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      x-business-rules:
      - login_id/password 자격 불일치는 401; 쿠키 HttpOnly·SameSite=Lax·환경별 Secure는 REQ-077; 로그인 성공과 메뉴 접근 판정은 별도
      - 세션 수명·재사용 OQ-DATA-004, 사용중지 계정 인증 판정 OQ-006 미승인
      - REQ-051 전후값·처리자·처리일시·사유 추적 구조; 실제 보존 방식·기간·사유 필수는 OQ-002 승인 의존
      x-side-effects:
      - session.account_id의 user_account 참조와 created_at/updated_at 서버 관리; 인증 쿠키 발급, 비밀번호·세션 식별자의 JSON 노출 없음; 재사용·수명
        OQ-DATA-004
      x-state-transitions:
      - 내부 계정 인증 전 -> 세션 인증 후; 값 enum·수명 OQ-DATA-004
      x-required-tests:
      - 'happy: 로컬 Compose 최초 실행과 승인된 admin/admin 시드로 POST /api/auth/login -> 200 success=true/meta와 쿠키 발급, 같은 쿠키의
        GET /api/auth/me에서 R09 확인; 이어 메뉴 조회와 9개 관리 화면의 조회 API 모두 2xx 확인'
      - 'auth: 존재하는 login_id에 불일치 password 제출 -> 401 ApiError, 인증 session 및 쿠키 발급 없음'
      - 'validation: login_id를 JSON 객체로 제출 또는 필수 password 누락 -> 400 ApiError, session 생성 없음; ApiError.fieldErrors에서
        login_id/password 중 실패 필드와 비어 있지 않은 message 확인'
      - 'business: 인증 전에 존재하는 login_id와 틀린 password로 POST /api/auth/login -> 401 ApiError, 해당 요청의 session 생성·Set-Cookie
        발급 없음; 올바른 자격 증명의 재요청은 200 후 GET /api/auth/me 성공'
      - 'side-effect: 성공 후 DB SELECT session JOIN user_account ON account_id로 인증 계정 연결과 session.created_at/updated_at
        확인 -> 관계 저장; Set-Cookie HttpOnly·SameSite=Lax·환경별 Secure 확인, JSON에 password/password_hash/session_id 미노출'
      - 'side-effect: README 또는 quickstart에 명시된 로컬 admin/admin으로 로그인 -> session.account_id가 초기 user_account에 연결되고
        user_role에 R09 존재; 운영용 자격 증명으로 확대하지 않음'
      x-no-response-data-reason: 원문은 로그인 JSON data를 약속하지 않는다. 성공은 Set-Cookie와 getCurrentUser로 검증한다.
      responses:
        '200':
          description: 요청 성공; meta는 항상 존재하고 페이지 목록이면 page/size/total을 포함한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          headers:
            Set-Cookie:
              description: CMSSESSION=<opaque>; Path=/; HttpOnly; SameSite=Lax. 로컬 HTTP Secure=false, 운영 TLS Secure=true.
                세션 수명 OQ-DATA-004.
              schema:
                type: string
        '400':
          description: 입력 형식 검증 실패; 상세 업무 검증 규칙·오류 코드는 OQ 승인 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 세션 미인증 또는 로그인 자격 증명 불일치; 보호 데이터 불변
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

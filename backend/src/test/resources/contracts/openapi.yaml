x-open-questions:
- id: OQ-001
  subject: 조직 원천/로컬 관계 경계
  decision: 조직 쓰기 모델·이력 보존 경계 승인 필요
- id: OQ-002
  subject: 변경 추적의 영속성과 보존 범위
  decision: 추적 구조만 확정; 운영 감사 화면·내보내기 생성 금지
- id: OQ-003
  subject: 권한 충돌 우선순위
  decision: 명시 거부 우선/허용 합집합을 확정하지 않는다
- id: OQ-004
  subject: 기능 권한과 데이터 범위
  decision: 독립 관리 기능 생성 금지; 화면·서버 판정 범위 승인 필요
- id: OQ-005
  subject: 역할 승인·기간·보직 정책
  decision: 처리자=승인자·자동 부여·기간 밖 효과를 가정하지 않는다
- id: OQ-006
  subject: 내부 계정 생성·수정 범위
  decision: 지원 API 입력·배치 UI·로그인 차단 시점 확인
- id: OQ-007
  subject: 최후 관리자 보호
  decision: 추가 거부 정책을 확정 요구로 사용하지 않는다
- id: OQ-UI-001
  subject: 검색·목록 정책
  decision: 필수 검색 영역에 미정 표기; CSV·일괄 API 생성 금지
- id: OQ-UI-002
  subject: 조직 이력 표시
  decision: 조직 화면의 상세 보조영역 위치 승인 필요
- id: OQ-UI-009
  subject: 레퍼런스 디자인 자료
  decision: 구조·반응형 계약 유지; 값은 승인 후 결정
- id: OQ-UI-010
  subject: 로그인 메뉴 외 진입
  decision: 메뉴 leaf 대신 공개 /login 직접 진입을 기록한다
- id: OQ-DATA-001
  subject: 필드 세부 제약
  decision: 서버 검증은 필수; 수치·오류코드 정책은 승인 필요
- id: OQ-DATA-003
  subject: 식별자 수정 참조
  decision: 참조 무결성·변경 키 정책 확정 필요
- id: OQ-DATA-004
  subject: 역할 회수·상태 표현
  decision: 미정값을 없음/비활성으로 단정하지 않는다

      - login_id/password/personnel_id/use_status로 로컬 계정 등록; password 응답 금지·검증값 저장, 원천 snapshot 불변
      - 원천 연결 필수·연결 없는 계정·입력 화면 범위 OQ-006, use_status 값 OQ-DATA-004 미승인; 계정 조회는 통합 DB SELECT
      - REQ-051 전후값·처리자·처리일시·사유 추적 구조; 실제 보존 방식·기간·사유 필수는 OQ-002 승인 의존
      - 요청 DTO의 편집 범위만 허용한다. 다른 리소스·원천·서버 관리 필드를 이 operation으로 변경하려는 입력은 400 필드 오류로 거부하고 보호 데이터를 유지한다. 세부 업무 정책과
        이 기술 DTO 경계 검증을 구분한다.
      x-side-effects:
      - user_account.login_id/password_hash와 승인된 personnel_id 참조 저장, created_at/updated_at 서버 생성; 평문 저장·응답 없음, 원천
        불변
      x-required-tests:
      - 'happy: 승인된 계정 입력 fixture와 사용자 관리 허용 세션으로 login_id/password/personnel_id/use_status 제출 -> 200 success=true/meta,
        통합 테스트 DB SELECT user_account WHERE login_id=<입력>에서 등록 확인; 계정 GET API 없음, 연결·화면 입력 OQ-006 unresolved'
      - 'auth: POST /api/accounts에 세션 없음/사용자 관리 미허용 세션 -> 401/403 ApiError, user_account 생성과 원천 snapshot 변경 없음'
      - 'validation: personnel_id를 JSON 배열로 제출 -> 400 ApiError, user_account 생성 없음; ApiError.fieldErrors에서 personnel_id
        중 실패 필드와 비어 있지 않은 message 확인'
      - 'business: 내부 계정 등록 본문에 원천 employee_number를 추가하여 원천 사용자 생성 시도 -> 400 ApiError, fieldErrors에 employee_number
        표시, user_account 생성 없음 및 korus_personnel_snapshot 불변'
      - 'side-effect: 등록 후 통합 DB SELECT user_account -> login_id와 승인된 personnel_id 참조 저장, password는 password_hash
        검증값으로 저장되고 평문 미저장, created_at/updated_at 서버 생성; korus_personnel_snapshot 불변, 응답에 password/password_hash
        미노출'
      x-no-response-data-reason: 이 계정 operation은 결과 JSON data를 약속하지 않는다. 성공한 계정 저장은 PostgreSQL 통합 테스트에서 user_account를
        SELECT하여 확인한다. 독립 계정 GET·비밀번호 재설정 UI를 추가하지 않는다(OQ-006).

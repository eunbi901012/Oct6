          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 세션 미인증 또는 로그인 자격 증명 불일치; 보호 데이터 불변
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':

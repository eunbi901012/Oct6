  /api/menu-structure/{menuId}/parent:
    patch:
      operationId: changeMenuParent
      summary: 메뉴 부모 지정·변경
      tags:
      - menu-structure
      x-related-requirements:
      - REQ-024
      - REQ-026
      - REQ-047
      - REQ-048
      - REQ-049
      - REQ-051
      - REQ-055
      - REQ-064
      - REQ-066
      - REQ-067
      - REQ-084
      security:
      - SessionCookie: []
      parameters:
      - name: menuId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: menu.menu_id
      x-roles:
      - R09
      x-role-policy:
        initialSeed: R09는 원문 시드 관리자 권한으로 허용
        delegatedRoles: R01..R08의 위임 가능 범위·충돌 및 데이터 범위는 OQ-003/OQ-004 승인 필요; R09 단독 영구 정책이 아니다
        decision: 화면과 서버는 동일한 승인된 권한 판정을 사용
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuParentInput'
      x-business-rules:
      - 선택 menuId의 parent_menu_id 지정·변경을 트리 부모-자식 관계에 반영; 실행정보 수정과 분리
      - 자기/하위메뉴 참조 순환·부모 누락 처리 OQ-DATA-001, 최후 관리자 접근 차단 방지 OQ-007 미승인
      - REQ-051 전후값·처리자·처리일시·사유 추적 구조; 실제 보존 방식·기간·사유 필수는 OQ-002 승인 의존
      - 요청 DTO의 편집 범위만 허용한다. 다른 리소스·원천·서버 관리 필드를 이 operation으로 변경하려는 입력은 400 필드 오류로 거부하고 보호 데이터를 유지한다. 세부 업무 정책과
        이 기술 DTO 경계 검증을 구분한다.
      x-side-effects:
      - menu.parent_menu_id 참조 반영, 실행정보·display_order·created_at 유지 및 updated_at 서버 관리; menu_permission 참조 보존
      x-required-tests:
      - 'happy: 메뉴 구조 관리 허용 세션으로 선택 menuId의 parent_menu_id를 다른 기존 부모로 변경 -> 200 success=true/meta, GET /api/menu-structure에서

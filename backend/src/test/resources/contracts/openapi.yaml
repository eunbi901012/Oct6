        제출 -> 200 success=true/meta, GET /api/user-roles?userId=<대상>&page=0&size=1에서 각 부여값 확인; 구분값은 승인 fixture 사용'
      - 'auth: POST /api/user-roles에 세션 없음/사용자 역할 관리 미허용 세션 -> 401/403 ApiError, user_role 생성 없음'
      - 'validation: account_id를 JSON 객체로 제출 또는 assignments=[] -> 400 ApiError, 대상 user_role 및 기존 매핑 불변; ApiError.fieldErrors에서

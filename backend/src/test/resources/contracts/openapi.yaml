          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: 입력 형식 검증 실패; 상세 업무 검증 규칙·오류 코드는 OQ 승인 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 세션 미인증 또는 로그인 자격 증명 불일치; 보호 데이터 불변
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 접근권한 없음; 보호 데이터 불변. 미승인 OQ 정책의 거부코드로 임의 사용하지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
